name: release-please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Release PR summary
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != '' }}
        run: |
          echo "Release Please opened or updated a Release PR."
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "pr=${{ steps.release.outputs.pr }}"
