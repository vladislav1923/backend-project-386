name: release-please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

# Needs repo setting enabled:
# Settings → Actions → General → Workflow permissions
# → "Read and write permissions"
# → "Allow GitHub Actions to create and approve pull requests"
#
# Optional: set secret RELEASE_PLEASE_TOKEN (PAT with contents + pull_requests)
# if the default GITHUB_TOKEN is still blocked by org policy.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Release PR summary
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != '' }}
        run: |
          echo "Release Please opened or updated a Release PR."
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "pr=${{ steps.release.outputs.pr }}"
